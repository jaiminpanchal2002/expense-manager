<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Expense</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 2em auto;
        }

        label {
            display: block;
            margin-top: 1em;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .error {
            color: #dc2626;
            font-size: 0.9em;
        }

        .btn {
            margin-top: 1em;
            padding: 8px 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Add Expense</h1>

    <form th:action="@{/expenses}" th:object="${expenseRequest}" method="post">
        <label>Title</label>
        <input type="text" th:field="*{title}">
        <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>

        <label>Amount</label>
        <input type="number" step="0.01" th:field="*{amount}">
        <div class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>

        <label>Currency</label>
        <select th:field="*{currency}">
            <option value="EUR">EUR</option>
            <option value="INR">INR</option>
            <option value="USD">USD</option>
        </select>

        <label>Category</label>
        <select th:field="*{category}">
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
        </select>

        <label>Date</label>
        <input type="date" th:field="*{expenseDate}">
        <div class="error" th:if="${#fields.hasErrors('expenseDate')}" th:errors="*{expenseDate}"></div>

        <label>Note (optional)</label>
        <textarea th:field="*{note}"></textarea>

        <button class="btn" type="submit">Save</button>
        <a th:href="@{/expenses}">Cancel</a>
    </form>
</body>

</html>
