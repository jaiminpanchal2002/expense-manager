<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="brand">
    <div class="logo">💰</div>
    <div class="name">Expense Manager</div>
</div>
            <h1>Create your account</h1>
            <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                <div class="field">
                    <label>Name</label>
                    <input type="text" th:field="*{name}">
                    <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" th:field="*{email}">
                    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" th:field="*{password}">
                    <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
            <p class="auth-foot">Already have an account? <a th:href="@{/login}">Login</a></p>
        </div>
    </div>
</body>

</html>
