<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 2em auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 1em;
            margin: 1.5em 0;
        }

        .total {
            font-size: 1.4em;
            font-weight: bold;
            color: #2563eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1em;
        }

        th,
        td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .btn {
            padding: 6px 12px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc2626;
        }

        .btn-link {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <h1>Hi, <span th:text="${userName}">User</span></h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger">Logout</button>
        </form>
    </div>

    <a class="btn" th:href="@{/expenses/new}">+ Add Expense</a>

    <div class="month-nav">
        <a class="btn-link" th:href="@{/dashboard(ym=${prevMonth})}">&larr; Previous</a>
        <strong th:text="${monthLabel}">May 2026</strong>
        <a class="btn-link" th:href="@{/dashboard(ym=${nextMonth})}">Next &rarr;</a>
    </div>

    <p class="total">Total this month: <span th:text="${total}">0</span></p>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Title</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${expenses}">
                <td th:text="${e.expenseDate}">2026-05-19</td>
                <td th:text="${e.title}">Groceries</td>
                <td th:text="${e.category}">FOOD</td>
                <td th:text="${e.amount} + ' ' + ${e.currency}">25.00 EUR</td>
                <td>
                    <form th:action="@{'/expenses/' + ${e.id} + '/delete'}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(expenses)}">
                <td colspan="5" style="text-align:center; color:#888;">No expenses this month.</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
