<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 4em auto;
        }

        label {
            display: block;
            margin-top: 1em;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .btn {
            margin-top: 1em;
            padding: 10px;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .msg {
            padding: 10px;
            border-radius: 4px;
            margin-top: 1em;
        }

        .ok {
            background: #dcfce7;
            color: #166534;
        }

        .err {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>
    <h1>Login</h1>
    <div class="msg ok" th:if="${param.registered}">Registration successful — please log in.</div>
    <div class="msg ok" th:if="${param.logout}">You have been logged out.</div>
    <div class="msg err" th:if="${param.error}">Invalid email or password.</div>

    <form th:action="@{/login}" method="post">
        <label>Email</label>
        <input type="email" name="username" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn">Login</button>
    </form>
    <p>No account? <a th:href="@{/register}">Register here</a></p>
</body>

</html>
