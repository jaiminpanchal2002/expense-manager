<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Expense</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container" style="max-width:560px;">

    <div class="page-head">
        <h1>Add Expense</h1>
        <a class="back-link" th:href="@{/dashboard}">← Back to dashboard</a>
    </div>

    <div class="panel">
        <form th:action="@{/expenses}" th:object="${expenseRequest}" method="post">
            <div class="field">
                <label>Title</label>
                <input type="text" th:field="*{title}" placeholder="e.g. Groceries at REWE">
                <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="form-row">
                <div class="field">
                    <label>Amount</label>
                    <input type="number" step="0.01" th:field="*{amount}" placeholder="0.00">
                    <div class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                </div>
                <div class="field">
                    <label>Currency</label>
                    <select th:field="*{currency}">
                        <option value="EUR">EUR</option>
                        <option value="INR">INR</option>
                        <option value="USD">USD</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="field">
                    <label>Category</label>
                    <select th:field="*{category}">
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                    </select>
                </div>
                <div class="field">
                    <label>Date</label>
                    <input type="date" th:field="*{expenseDate}">
                    <div class="error" th:if="${#fields.hasErrors('expenseDate')}" th:errors="*{expenseDate}"></div>
                </div>
            </div>

            <div class="field">
                <label>Note (optional)</label>
                <textarea th:field="*{note}" placeholder="Any details..."></textarea>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Save Expense</button>
                <a class="btn btn-ghost" th:href="@{/dashboard}">Cancel</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
